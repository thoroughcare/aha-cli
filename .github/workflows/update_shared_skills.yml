name: Update shared skills

# Propose the shared-skill facet bump nobody gets round to doing by hand.
#
# The Claude skills under `.claude/skills/` come from the `thoroughcare-tooling`
# facet in the private `thoroughcare/claude-plugins` repo. They are pinned by tag
# in `facets.json` and **committed**, so a release there reaches this repo only
# when someone bumps the pin, re-runs `facet install`, and commits the
# re-materialized tree — one PR per repo per release. That did not happen:
# `facet-v0.5.0` was tagged on 2026-09-11 and four of the seven consuming repos
# were still on `facet-v0.1.0` when this workflow was written (WDOGS-530).
#
# Hourly, this resolves the newest `facet-v*` tag and — when it is ahead of the
# pin here — opens a PR carrying the bump.
#
# **It proposes; it never merges.** The guarantee that a release cannot change a
# repo underneath its developers is untouched, because that guarantee lives in
# the review-and-merge step, not in the fact that a human typed `facet install`.
# What this removes is the gap between "a release exists" and "a reviewable PR
# exists".
#
# ---------------------------------------------------------------------------
# THIS FILE IS BYTE-IDENTICAL IN EVERY REPO THAT CONSUMES THE FACET
#
#   thoroughcare/{tcare, thoroughcare, claude-plugins, rpm-consumer,
#                 scrummaster, aha-mcp, aha-cli}
#
# Nothing in it is repo-specific: the base branch, the repo name and the facet
# pin are all read from the event or the working tree at run time. Keeping the
# bytes identical is what makes `diff` across two checkouts a real check that
# the fleet is in sync, so **a change here is a change in all seven**, shipped
# on one ticket. If a repo ever genuinely needs to differ, express the
# difference as something the file reads rather than as a local edit.
# ---------------------------------------------------------------------------
#
# Four things worth knowing before editing:
#
#   * **`facet install` ignores an edited git ref while a lockfile is present.**
#     On CLI 0.33.1 it treats `facets.lock` as the source of truth for a
#     git-sourced facet: bump the tag in `facets.json`, run `facet install`, and
#     it prints `cache hit thoroughcare-tooling@<old>` and `(no changes)`, exits
#     0, and leaves the manifest and the lockfile disagreeing. `--frozen-lockfile`,
#     whose whole job is to fail on that drift, does not catch it either. So the
#     bump step below **deletes `facets.lock`** to force a re-resolve from the
#     manifest. The omission set lives in `facets.json` and survives.
#   * **`facet add` would destroy the omissions.** It rewrites `facets.json` into
#     the bare-string form and drops `materialization.skills` with it. The bump
#     is an edit to the ref plus `install` — which is also why the edit is made
#     with `jq` on one field rather than with `sed` on the file.
#   * **Never hand-copy `skills/` from the facet.** The claude-code adapter
#     normalizes `SKILL.md` frontmatter, so a hand copy differs byte-for-byte
#     from an install — and since `install` writes only what changed, that turns
#     every later bump's diff into noise.
#   * **No `--accept-mcp`.** The facet ships skills today. If it ever declares an
#     MCP server, the install has no TTY to approve it with and this job fails
#     loudly — which is the point. Writing an MCP server into a repo is a
#     decision a person makes.
#
# **No `set -e` / `set -u` / `set -o pipefail`, and no `|| exit 1`.** That is
# `thoroughcare:docs/ci-cd/ci.md` §11, and since this file ships byte-identical
# into that repo too, its rule is the one all seven copies follow. A command
# that must succeed is suffixed `|| exit` — bare, so it re-uses `$?` and aborts
# with the real exit code rather than a flattened `1`; the last command in a
# block needs none, its status already being the block's. Actions runs `run:`
# under `bash -e -o pipefail` regardless, so this is about not *relying* on
# flags that are silently disabled inside command substitutions, on the left of
# `&&`/`||`, and in `if`/`while` conditions — one of which cost an unreachable
# error message in this very file during review.
#
# Background: `docs/tech-guides/facet-skills.md` in tcare, the facet's own
# `docs/ROLLOUT.md`, and `thoroughcare:docs/ci-cd/ci.md` §11 for the shell rule.

on:
  schedule:
    # Hourly, deliberately off the hour: GitHub queues every `0 * * * *` cron in
    # the world at the same moment and delays them under load.
    #
    # GitHub **disables a scheduled workflow after 60 days without repository
    # activity**, and says so only by email to the last committer. On a quiet
    # repo that is the likeliest way this stops running, and it looks exactly
    # like "the facet just hasn't released anything" — so if a repo drifts
    # behind, check the Actions tab for the disable banner before debugging the
    # workflow.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Facet tag to move to (default: the newest facet-v* tag)"
        required: false
        type: string

# Nothing here uses GITHUB_TOKEN to write. The branch, the PR and the comments
# are all made with ROBOT_GITHUB_TOKEN, which this needs to be rather than
# GITHUB_TOKEN anyway: a PR opened by GITHUB_TOKEN fires no `pull_request`
# events, so it would sit there with no CI and no review.
permissions:
  contents: read

concurrency:
  # One at a time per repo. Deliberately not `cancel-in-progress`: a run killed
  # between the push and `gh pr create` leaves a branch with no PR, and while
  # the guard below heals exactly that, not creating the state is better.
  group: update-shared-skills
  cancel-in-progress: false

env:
  FACET_REPO: thoroughcare/claude-plugins
  FACET_NAME: thoroughcare-tooling
  # Pinned deliberately: an unpinned CLI would make the bytes written into
  # `.claude/skills/` depend on whatever shipped that morning. tcare's
  # `bin/facet` pins the same version for the local flow; move the two together.
  FACET_CLI_VERSION: "0.33.1"
  # One branch per target tag, so a branch is written once and never rewritten
  # — this workflow force-pushes nothing.
  BRANCH_PREFIX: devops/shared-skills-

jobs:
  bump:
    name: Propose a facet bump
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # A fork inherits the schedule but none of the secrets, so without this it
    # would fail hourly in someone else's account for a reason that is not their
    # problem.
    if: github.repository_owner == 'thoroughcare'
    steps:
      # ROBOT_GITHUB_TOKEN is an org secret, and an org secret is shared with a
      # chosen set of repos. Fail here with something actionable rather than
      # four steps later with an opaque git authentication error.
      - name: Check the robot token is available here
        env:
          ROBOT_GITHUB_TOKEN: ${{ secrets.ROBOT_GITHUB_TOKEN }}
        run: |
          if [ -z "${ROBOT_GITHUB_TOKEN}" ]; then
            echo "::error::ROBOT_GITHUB_TOKEN is not available to ${GITHUB_REPOSITORY}. It is an org secret shared with a selected set of repositories, so an org admin has to add this one. It is needed both to read the private ${FACET_REPO} and to open the PR."
            exit 1
          fi

      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Shallow is enough. The bump is one commit on top of a commit the
          # remote already has, so the push sends only the new objects.
          fetch-depth: 1
          # Leaves the remote credentialed, so the push needs no URL rewriting,
          # and makes the commit and the PR come from the robot rather than from
          # GITHUB_TOKEN.
          token: ${{ secrets.ROBOT_GITHUB_TOKEN }}

      # The entire cost of a no-op run, which is what almost every run is: one
      # `ls-remote` and one `jq`. Nothing is installed unless a bump is real.
      - name: Resolve the newest facet tag and compare it with the pin
        id: resolve
        env:
          ROBOT_GITHUB_TOKEN: ${{ secrets.ROBOT_GITHUB_TOKEN }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [ ! -f facets.json ]; then
            echo "::error::No facets.json in ${GITHUB_REPOSITORY}; this repo does not consume the facet."
            exit 1
          fi

          # A `facets.json` entry is EITHER a source string OR an object with a
          # `source` key. A reader that assumes one form misreads the other, and
          # a *writer* that does destroys the repo's omission set — so both the
          # read here and the write below handle the two shapes.
          if ! current_source="$(jq -er --arg f "${FACET_NAME}" \
                '.facets[$f] | if type == "string" then . else .source end' facets.json)"; then
            echo "::error::facets.json has no '${FACET_NAME}' under .facets — this repo declares some other facet, or the manifest is malformed. Every other failure here names itself; this one used to exit on jq's message alone."
            exit 1
          fi
          current_tag="${current_source##*#}"
          if [ "${current_tag}" = "${current_source}" ]; then
            echo "::error::The ${FACET_NAME} source in facets.json carries no '#<ref>': ${current_source}"
            exit 1
          fi

          if [ -n "${REQUESTED_TAG}" ]; then
            # It becomes a git ref and a branch name, so constrain its shape
            # rather than trusting the dispatch form. Deliberately wider than
            # the release-tag pattern below, so a prerelease can be dispatched
            # on purpose.
            if ! printf '%s' "${REQUESTED_TAG}" | grep -qE '^facet-v[0-9A-Za-z][0-9A-Za-z.+_-]*$'; then
              echo "::error::'${REQUESTED_TAG}' is not a facet tag (expected facet-v<something>)."
              exit 1
            fi
            # The regex above constrains the *shape* and excludes anything that
            # could escape a branch name; it does not know git's ref grammar, so
            # `facet-v1..0` and a trailing `.` both pass it and are illegal refs.
            # Let git answer that, here, rather than letting `git switch -c`
            # fail six steps later with a raw error.
            if ! git check-ref-format "refs/heads/${BRANCH_PREFIX}${REQUESTED_TAG}"; then
              echo "::error::'${REQUESTED_TAG}' would make an invalid git ref (${BRANCH_PREFIX}${REQUESTED_TAG})."
              exit 1
            fi
            target_tag="${REQUESTED_TAG}"
            by_hand=true
            echo "Target tag given by hand: ${target_tag}"
          else
            # Read the refs and filter them as two steps, not one pipeline.
            # Folded together, a real failure here — a revoked token, a network
            # blip, a rate limit — is swallowed by the downstream `grep`'s
            # exit-1-on-no-match and then by the `|| true` that has to absorb
            # it, and surfaces as "no facet-v tag found": indistinguishable from
            # the facet genuinely having no releases. That is the same
            # nobody-notices-it-stopped-working failure this workflow exists to
            # prevent, so **"the command failed" and "the command found
            # nothing" stay distinct**.
            if ! refs="$(git ls-remote --tags --refs \
                  "https://x-access-token:${ROBOT_GITHUB_TOKEN}@github.com/${FACET_REPO}.git" \
                  'refs/tags/facet-v*')"; then
              echo "::error::Could not read tags from ${FACET_REPO}. This is an access or network failure, not an empty tag list — check that ROBOT_GITHUB_TOKEN is still granted to this repo and can read that one."
              exit 1
            fi

            # `--refs` above drops the peeled `^{}` duplicates; the grep keeps
            # release tags only, so a `facet-v0.6.0-rc.1` is never proposed to a
            # repo on the schedule. `|| true` now only absorbs "no match", which
            # the check below turns into its own message.
            target_tag="$(
              printf '%s\n' "${refs}" \
                | awk '{ print $2 }' \
                | sed 's#^refs/tags/##' \
                | grep -E '^facet-v[0-9]+\.[0-9]+\.[0-9]+$' \
                | sort -V \
                | tail -n 1 || true
            )"
            by_hand=false
          fi

          if [ -z "${target_tag}" ]; then
            echo "::error::${FACET_REPO} was read successfully but has no facet-v<x.y.z> release tag."
            exit 1
          fi

          echo "pinned: ${current_tag}"
          echo "newest: ${target_tag}"

          {
            echo "current_tag=${current_tag}"
            echo "target_tag=${target_tag}"
          } >> "${GITHUB_OUTPUT}"

          if [ "${current_tag}" = "${target_tag}" ]; then
            echo "bump=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Already on ${current_tag}; nothing to propose."
            exit 0
          fi

          # Only ever move forward *on the schedule*. A pin ahead of the newest
          # tag means someone pinned a tag that was later deleted, or an
          # unreleased ref on purpose — either way, silently rolling it back at
          # 23 past the hour is the wrong move. A hand dispatch is exempt,
          # because rolling a bad release back is exactly what it is for.
          newer="$(printf '%s\n%s\n' "${current_tag}" "${target_tag}" | sort -V | tail -n 1)" || exit
          if [ "${by_hand}" = "false" ] && [ "${newer}" != "${target_tag}" ]; then
            echo "bump=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::Pinned at ${current_tag}, which is ahead of the newest tag ${target_tag}. Leaving it alone."
            exit 0
          fi

          echo "bump=true" >> "${GITHUB_OUTPUT}"

      # The duplicate-PR guard, and the only state this workflow keeps. A PR for
      # this exact branch in ANY state is a stop: open means it is already
      # proposed, merged means it landed, and closed-unmerged means a human
      # declined this release — of the three, re-proposing that one every hour
      # would be the worst.
      - name: Check whether this bump has already been proposed
        id: guard
        if: steps.resolve.outputs.bump == 'true'
        env:
          GH_TOKEN: ${{ secrets.ROBOT_GITHUB_TOKEN }}
          TARGET_TAG: ${{ steps.resolve.outputs.target_tag }}
        run: |
          branch="${BRANCH_PREFIX}${TARGET_TAG}"
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"

          existing="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${branch}" \
            --state all --limit 1 --json number,state,url \
            --jq '.[0] | select(.) | "#\(.number) \(.state) \(.url)"')" || exit

          if [ -n "${existing}" ]; then
            echo "proceed=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::${GITHUB_REPOSITORY} already has a PR for ${branch}: ${existing}"
            exit 0
          fi

          # A branch with no PR is the one recoverable failure: a previous run
          # pushed and then died before `gh pr create`. Open the PR for what is
          # already there rather than rebuilding it — rebuilding would mean a
          # force-push, and this workflow force-pushes nothing.
          #
          # `--exit-code` gives 2 for "no matching ref" specifically, so the
          # three answers stay three: found, genuinely absent, and couldn't
          # ask. Folding the last two together would make a network blip look
          # like a clean slate and push a branch that may already exist.
          rc=0
          git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1 || rc=$?
          case "${rc}" in
            0)
              echo "proceed=adopt" >> "${GITHUB_OUTPUT}"
              echo "::notice::${branch} exists on the remote with no PR; opening one for it."
              exit 0
              ;;
            2)
              ;;
            *)
              echo "::error::Could not check whether ${branch} exists on the remote (git ls-remote exited ${rc}). This is a lookup failure, not an absent branch."
              exit 1
              ;;
          esac

          echo "proceed=true" >> "${GITHUB_OUTPUT}"

      # Pinning the CLI does nothing if the runtime under it drifts: a runner
      # image bump would silently change the Node the CLI executes on, which is
      # the same non-reproducibility the version pin exists to prevent.
      - name: Set up Node
        if: steps.guard.outputs.proceed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install the facet CLI
        if: steps.guard.outputs.proceed == 'true'
        run: npm install -g "agent-facets@${FACET_CLI_VERSION}"

      - name: Materialize the bump
        id: materialize
        if: steps.guard.outputs.proceed == 'true'
        env:
          ROBOT_GITHUB_TOKEN: ${{ secrets.ROBOT_GITHUB_TOKEN }}
          CURRENT_TAG: ${{ steps.resolve.outputs.current_tag }}
          TARGET_TAG: ${{ steps.resolve.outputs.target_tag }}
        run: |
          # The CLI shells out to git itself, so the credential cannot be passed
          # per invocation — it has to be somewhere git will read. The runner is
          # ephemeral and single-tenant, and Actions masks the secret in logs.
          #
          # Note the scope: this is `--global`, so from here on **every**
          # github.com git operation in the job uses the robot's token, not just
          # the CLI's clone. Harmless today — the checkout already persisted the
          # same token for this repo — but a step added later that touches
          # another repo will silently pick it up, so know that before adding
          # one.
          git config --global \
            "url.https://x-access-token:${ROBOT_GITHUB_TOKEN}@github.com/.insteadOf" \
            "https://github.com/" || exit

          # The CLI clones into TMPDIR and renames into ~/.facet/cache; when the
          # two sit on different filesystems the rename fails with
          # `EXDEV: cross-device link not permitted` and the install aborts.
          mkdir -p "${HOME}/.facet/tmp" || exit
          export TMPDIR="${HOME}/.facet/tmp"

          # Adapters install globally, not per project. A runner has none, and a
          # non-interactive shell cannot be prompted for one.
          facet adapter add claude-code || exit

          # Rewrite only the ref, and only inside this facet's entry. `jq`
          # rather than `sed` so the object form's `materialization` block is
          # carried across verbatim — losing it would silently install the
          # skills this repo has declined.
          tmp="$(mktemp)" || exit
          jq --arg f "${FACET_NAME}" --arg tag "${TARGET_TAG}" '
            .facets[$f] |= (
              if type == "string"
              then sub("#.*$"; "#" + $tag)
              else .source |= sub("#.*$"; "#" + $tag)
              end
            )
          ' facets.json > "${tmp}" || exit
          mv "${tmp}" facets.json || exit

          # See the header: with a lockfile present, CLI 0.33.1 resolves the
          # LOCKED commit and ignores the ref just written. Deleting it is what
          # makes the install re-read `facets.json`. It is regenerated below,
          # and everything it records is derived from the manifest.
          rm -f facets.lock

          facet install --verbose || exit

          if [ ! -f facets.lock ]; then
            echo "::error::facet install wrote no facets.lock, so the install did not resolve."
            exit 1
          fi

          # `jq -r` prints the literal string `null` and exits 0 when the path
          # is absent, so `|| exit` cannot see it — and a lockfile whose shape
          # changed under a future CLI would put `(null)` into the commit
          # message and the PR body rather than failing the job. `-e` makes an
          # absent path exit 1; the string check catches an explicit JSON null.
          # The `[ ! -f facets.lock ]` test above only covers "no lockfile at
          # all", not "a lockfile that doesn't say what we expect".
          resolved="$(jq -er --arg f "${FACET_NAME}" '.facets[$f].source.commit' facets.lock)" || resolved=""
          if [ -z "${resolved}" ] || [ "${resolved}" = "null" ]; then
            echo "::error::facets.lock has no .facets[\"${FACET_NAME}\"].source.commit. The install wrote a lockfile this workflow cannot read — most likely the facet CLI changed its format, so check FACET_CLI_VERSION (${FACET_CLI_VERSION}) against what it writes."
            exit 1
          fi
          echo "resolved ${TARGET_TAG} to ${resolved}"
          echo "commit=${resolved}" >> "${GITHUB_OUTPUT}"

          # Belt and braces, and deliberately kept: the resolve step has already
          # established `current_tag != target_tag`, so the `jq` rewrite above
          # always dirties `facets.json` and this cannot fire today. It is here
          # so that a later change to how the target is chosen turns "nothing
          # happened" into a warning rather than an empty commit and a PR with
          # no diff.
          # Read, then interpret — the same reason as the orphan sweep's PR
          # lookup. Inline in a test's condition, a failing `git status` would
          # read as "no diff". Fail-safe rather than destructive here (a missed
          # proposal, self-healing next hour), but one shape in two places
          # should not be guarded in one of them and not the other.
          status="$(git status --porcelain)" || exit
          if [ -z "${status}" ]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::${CURRENT_TAG} -> ${TARGET_TAG} produced no diff; nothing to propose."
            exit 0
          fi
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      # Which skills moved, so the PR says what changed rather than only that
      # something did. Classified against HEAD, before anything is committed.
      - name: Summarize which skills moved
        id: summary
        if: steps.materialize.outputs.changed == 'true'
        run: |
          work="${RUNNER_TEMP}/skills"
          mkdir -p "${work}" || exit

          # The directory names under `.claude/skills/` are the skill names, at
          # HEAD and now. A file changing inside a skill is an update; the
          # directory appearing or disappearing is an add or a removal, and
          # those are the two a reviewer must not miss.
          git ls-tree -d --name-only HEAD -- .claude/skills/ \
            | sed 's#^\.claude/skills/##' | sort -u > "${work}/before"
          find .claude/skills -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
            | sort -u > "${work}/after"
          git status --porcelain -- .claude/skills \
            | awk '{ print $NF }' | cut -d/ -f3 | sort -u > "${work}/touched"

          comm -13 "${work}/before" "${work}/after" > "${work}/added"
          comm -23 "${work}/before" "${work}/after" > "${work}/removed"
          comm -12 "${work}/before" "${work}/after" > "${work}/kept"
          comm -12 "${work}/touched" "${work}/kept" > "${work}/updated"

          # `a, b, c` on one line, or an em dash when the list is empty, so the
          # PR body reads as prose in all three cases. `paste -d` cycles through
          # the delimiters it is given, so `-d ', '` would join with a comma and
          # a space alternately; the separator has to be one character.
          as_list() {
            if [ -s "$1" ]; then paste -sd ',' "$1" | sed 's/,/, /g'; else printf '%s' '—'; fi
          }

          # Captured rather than substituted inline, for the same read-then-
          # interpret reason as the `gh` and `git` lookups elsewhere. There is
          # no realistic way `paste`/`sed` fail against a temp file written two
          # lines up, and the worst case is a malformed table cell rather than
          # a wrong action — but this was the file's last instance of the shape
          # its own header argues against, and one exception is what a later
          # reader has to stop and re-derive.
          added="$(as_list "${work}/added")" || exit
          removed="$(as_list "${work}/removed")" || exit
          updated="$(as_list "${work}/updated")" || exit

          {
            printf 'added=%s\n' "${added}"
            printf 'removed=%s\n' "${removed}"
            printf 'updated=%s\n' "${updated}"
          } >> "${GITHUB_OUTPUT}"

      - name: Commit and push the branch
        if: steps.materialize.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.guard.outputs.branch }}
          # Built here rather than in the shell so the markdown keeps its own
          # indentation: a heredoc's body would have to start at column 0, which
          # ends the YAML block scalar this step is written in.
          COMMIT_MESSAGE: |
            Bump the shared skills to ${{ steps.resolve.outputs.target_tag }}

            Move the `${{ env.FACET_NAME }}` facet from
            `${{ steps.resolve.outputs.current_tag }}` to `${{ steps.resolve.outputs.target_tag }}`
            (${{ steps.materialize.outputs.commit }}) and commit the skills
            `facet install` re-materialized from it.

            Opened by the `Update shared skills` workflow, which checks hourly
            whether ${{ env.FACET_REPO }} has a newer release than this repo is
            pinned to. It proposes the bump; merging it is a human's call.
        run: |
          git config user.name "github-actions[bot]" || exit
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com" || exit
          git switch -c "${BRANCH}" || exit

          # The three paths are one change: a `facets.json` bumped without the
          # lockfile and the materialized tree is a lie about what the repo
          # runs. Nothing outside them is staged — in particular no workflow
          # file, so the push needs no `workflow` scope on the token.
          git add facets.json facets.lock .claude/skills || exit
          git commit --file - <<<"${COMMIT_MESSAGE}" || exit

          git push origin "${BRANCH}"

      - name: Open the PR
        id: pr
        if: steps.materialize.outputs.changed == 'true' || steps.guard.outputs.proceed == 'adopt'
        env:
          GH_TOKEN: ${{ secrets.ROBOT_GITHUB_TOKEN }}
          BRANCH: ${{ steps.guard.outputs.branch }}
          BASE: ${{ github.event.repository.default_branch }}
          TARGET_TAG: ${{ steps.resolve.outputs.target_tag }}
          # Same reason as COMMIT_MESSAGE above. The step outputs are empty when
          # this is adopting a branch a previous run pushed, so each falls back
          # to an em dash rather than rendering a blank table cell.
          PR_BODY: |
            Moves the `${{ env.FACET_NAME }}` facet from `${{ steps.resolve.outputs.current_tag }}`
            to `${{ steps.resolve.outputs.target_tag }}` and commits the skills `facet install`
            re-materialized from it. `facets.json`, `facets.lock` and `.claude/skills/` are one
            change — a manifest bumped without the other two is a lie about what this repo runs.

            | | |
            |---|---|
            | **Skills added** | ${{ steps.summary.outputs.added || '—' }} |
            | **Skills removed** | ${{ steps.summary.outputs.removed || '—' }} |
            | **Skills updated** | ${{ steps.summary.outputs.updated || '—' }} |

            **Read [the CHANGELOG for the range being crossed](https://github.com/${{ env.FACET_REPO }}/blob/${{ steps.resolve.outputs.target_tag }}/CHANGELOG.md)
            before approving.** A bump changes how every future Claude session in this repo
            behaves, so what there is to review is the behaviour the release describes, not the
            line count.

            A skill **appearing or disappearing** is the one thing worth stopping on. Which
            skills this repo takes is a decision it makes for itself, through
            `materialization.skills` in `facets.json` — not something a bump should carry in by
            default. If a new one is not wanted here, decline it in `facets.json` on this branch.

            ### How it was produced

            ```shell
            # the ref in facets.json, rewritten with jq so the omission set survives
            rm -f facets.lock   # CLI 0.33.1 resolves the LOCKED commit, ignoring an edited git ref
            facet install       # agent-facets@${{ env.FACET_CLI_VERSION }}
            ```

            Nothing was hand-copied. The claude-code adapter normalizes `SKILL.md` frontmatter, so
            a hand copy differs byte-for-byte from an install — which is also why `facet install`
            writing only what changed makes this diff exactly the skills the release touched.

            ### Testing disposition

            The diff is confined to `.claude/skills/**` and the two manifests that materialize it,
            and nothing else — no request path, no schema, no user-facing surface, so there is no
            runtime behaviour for QE to exercise.

            Each of these repos states that as a **path fact** rather than a judgement, precisely
            so it can be settled without reading the diff — *"turns on where the diff is, never on
            how testable it looks to you"*. This run therefore applies the repo's own
            "not testable" label where the repo has one, and applies nothing where it doesn't.
            If the label is absent above, this repo has no such label rather than the run having
            declined to set it.

            ---

            Opened by the [`Update shared skills`](https://github.com/${{ github.repository }}/blob/${{ github.event.repository.default_branch }}/.github/workflows/update_shared_skills.yml)
            workflow (WDOGS-530), which checks hourly whether ${{ env.FACET_REPO }} has a newer
            release than this repo is pinned to. It proposes; it never merges.
        run: |
          # Opened ready for review rather than as a draft: the change is
          # complete the moment the workflow makes it, and a draft is not
          # auto-reviewed. `gh` refuses to open a second PR for a branch that
          # already has one, and the guard above means there is none — but a
          # racing run would surface exactly here, so treat "already exists" as
          # success rather than failing the run.
          if ! out="$(gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --base "${BASE}" \
            --head "${BRANCH}" \
            --title "Bump the shared skills to ${TARGET_TAG}" \
            --body "${PR_BODY}" 2>&1)"; then
            # A herestring, not a pipe: `grep -q` closes the pipe on its first
            # match, so a still-writing `printf` upstream takes SIGPIPE — and
            # pipefail makes 141 the pipeline's status, turning "a PR already
            # exists" into a hard failure of the create.
            if grep -qi "already exists" <<<"${out}"; then
              echo "::notice::A PR for ${BRANCH} already exists; leaving it as is."
            else
              printf '%s\n' "${out}" >&2
              exit 1
            fi
          else
            printf '%s\n' "${out}"
          fi

          url="$(gh pr view "${BRANCH}" --repo "${GITHUB_REPOSITORY}" --json url --jq .url)" || exit
          number="$(gh pr view "${BRANCH}" --repo "${GITHUB_REPOSITORY}" --json number --jq .number)" || exit
          {
            echo "url=${url}"
            echo "number=${number}"
          } >> "${GITHUB_OUTPUT}"

      # Apply the repo's own "not testable by QE/QA" label, where it has one.
      #
      # This is a path fact, not a judgement. Every repo in the fleet words its
      # carve-out as a question about *where the diff is* — thoroughcare's says
      # so outright, "All four turn on where the diff is, never on how testable
      # it looks to you" — and the commit above stages exactly `facets.json`,
      # `facets.lock` and `.claude/skills/`, which is the agent-tooling carve-out
      # verbatim. A run settling that mechanically is what a path fact is for;
      # the QE-owned *outcome* labels (`QE Passed` / `QE Failed`) remain
      # untouched here and always.
      #
      # The name differs per repo — `Not testable by QE`, `not testable by QE`,
      # `not testable by QA` — so this matches case-insensitively against the
      # repo's real labels and uses the exact name it finds, rather than
      # hardcoding one into a file that has to be byte-identical across seven.
      # Four of the seven have no such label at all; there it does nothing.
      - name: Apply this repo's not-testable label, if it has one
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.ROBOT_GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          # A failed lookup warns and carries on rather than failing the job,
          # which is the opposite of the orphan sweep below — and deliberately
          # so. There, an unconfirmed answer would delete a branch; here the
          # worst case is a label gate left red for a human to clear, which is
          # exactly the state this step exists to improve on and never worse
          # than not having run. Failing a job whose PR is already open and
          # correct would report the wrong thing about the run.
          limit=1000
          if ! labels="$(gh label list --repo "${GITHUB_REPOSITORY}" --limit "${limit}" --json name --jq '.[].name')"; then
            echo "::warning::Could not list labels on ${GITHUB_REPOSITORY}; leaving #${PR} unlabelled. This is a lookup failure, not an absent label."
            exit 0
          fi

          # "No match" and "the page ended before the match" are different
          # answers, and a `--limit` silently conflates them — the same class of
          # bug this file spent five review rounds closing everywhere else, so
          # it does not get to survive here. A full page means the list may have
          # been truncated, which is worth saying out loud even though no repo
          # in the fleet is within two orders of magnitude of it.
          count="$(printf '%s\n' "${labels}" | grep -c . || true)"
          if [ "${count}" -ge "${limit}" ]; then
            echo "::warning::${GITHUB_REPOSITORY} returned ${count} labels, the full page — the list may be truncated, so a missing match below may mean 'not fetched' rather than 'not present'."
          fi

          # `sort` so a repo carrying more than one spelling picks the same one
          # every run rather than whichever the API happened to return first.
          name="$(printf '%s\n' "${labels}" | grep -iE '^not testable by (qe|qa)$' | sort | head -n 1 || true)"

          if [ -z "${name}" ]; then
            echo "::notice::${GITHUB_REPOSITORY} has no not-testable-by-QE/QA label; leaving #${PR} unlabelled."
            exit 0
          fi

          # Warn rather than `|| exit`, for the same reason the lookup above
          # does — and the review round that caught this was right that a bare
          # `|| exit` here contradicted the comment two paragraphs up. The PR is
          # open and correct by this point; failing the job over a label would
          # report the run as broken when its actual deliverable succeeded, and
          # would not attach the label either. Note this is a **one-shot**: the
          # duplicate-PR guard stops every later run before it reaches this
          # step, so a transient failure leaves that one PR for a human to
          # label — which is exactly the pre-existing state, never worse.
          if ! gh pr edit "${PR}" --repo "${GITHUB_REPOSITORY}" --add-label "${name}"; then
            echo "::warning::Could not apply '${name}' to #${PR}; leaving it unlabelled for a human to disposition."
            exit 0
          fi
          echo "Applied '${name}' to #${PR}."

      # At most one bump PR open at a time. Two releases in a week would
      # otherwise leave two PRs proposing the same thing at different versions,
      # and merging the older one would be undone by the newer immediately.
      # Dependabot's model: supersede, say so, close.
      #
      # **Close only what is provably older.** "Any other bump PR is an older
      # one" holds for the schedule, where `ls-remote` always resolves the
      # newest tag — and is false the moment `workflow_dispatch` is used, which
      # is the whole point of that input. Without the comparison below, a run
      # dispatched at `facet-v0.3.0` closes an open `facet-v0.5.0` PR and
      # deletes its branch, over a comment claiming it "bumps the facet
      # further". Refusing to close anything whose suffix is not a release tag
      # covers the other case: a human working under this prefix owns that
      # branch, not this workflow.
      - name: Close any bump PR this one supersedes
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.ROBOT_GITHUB_TOKEN }}
          BRANCH: ${{ steps.guard.outputs.branch }}
          TARGET_TAG: ${{ steps.resolve.outputs.target_tag }}
          NEW_URL: ${{ steps.pr.outputs.url }}
          NEW_PR: ${{ steps.pr.outputs.number }}
        run: |
          # Guard the two values this step would do damage with if they were
          # empty. Note what `-u` would and would not have done here: it fires
          # on a variable that was never *assigned*, and both of these come
          # from `env:`, so they are always bound even when empty — `-u` was
          # never covering today's case. What it covered is a future typo
          # (`${BRANCH_PREIFX}`), which now expands silently to empty, and this
          # is where that would land.
          #
          # The blast radius here is smaller than in the orphan sweep, though
          # not zero: with an empty prefix every open PR becomes a candidate,
          # and the release-tag regex below then has to match the *whole* head
          # ref — so a branch named under this org's `${type}/${TICKET}-…`
          # convention cannot reach the close, but one named exactly
          # `facet-v1.2.3` still could. The same regex gates both steps, so
          # what actually differs between them is how large a candidate set an
          # empty prefix would enumerate first, not how airtight the filter is.
          if [ -z "${BRANCH_PREFIX}" ] || [ -z "${TARGET_TAG}" ]; then
            echo "::error::Refusing to run with an empty BRANCH_PREFIX or TARGET_TAG."
            exit 1
          fi

          # Real `jq` with `--arg`, not `gh --jq`: `gh` has no way to bind a
          # variable, so the branch name would have to be spliced into the
          # filter — and it derives from a dispatch input, where one `\"` makes
          # the program malformed.
          candidates="$(gh pr list --repo "${GITHUB_REPOSITORY}" --state open \
            --limit 100 --json number,headRefName \
            | jq -r --arg prefix "${BRANCH_PREFIX}" --arg branch "${BRANCH}" \
                '.[] | select(.headRefName | startswith($prefix))
                     | select(.headRefName != $branch)
                     | "\(.number)\t\(.headRefName)"')" || exit

          while IFS=$'\t' read -r number head; do
            [ -n "${number}" ] || continue
            tag="${head#"${BRANCH_PREFIX}"}"

            # Deliberately the strict release pattern, not the wider shape
            # `workflow_dispatch` accepts. Two different branches fail it, and
            # only the first is "not ours": a human working under this prefix,
            # and a **prerelease this workflow itself opened** when someone
            # dispatched one on purpose.
            #
            # The second is left alone knowingly. `sort -V` orders
            # `facet-v0.6.0` *before* `facet-v0.6.0-rc.1` — the opposite of
            # semver — so admitting prereleases here would let a dispatched RC
            # decide it superseded the real release and close its PR. Getting
            # that wrong is worse than not tidying up, so a dispatched
            # prerelease branch stays outside the automation's reach and
            # whoever dispatched it closes it by hand.
            if ! printf '%s' "${tag}" | grep -qE '^facet-v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::notice::Leaving #${number} (${head}) alone: not a release tag, so it is either a human's branch or a deliberately dispatched prerelease. Neither is this workflow's to close."
              continue
            fi

            oldest="$(printf '%s\n%s\n' "${tag}" "${TARGET_TAG}" | sort -V | head -n 1)" || exit
            if [ "${tag}" = "${TARGET_TAG}" ] || [ "${oldest}" != "${tag}" ]; then
              echo "::notice::Leaving #${number} (${tag}) alone: it is not older than ${TARGET_TAG}."
              continue
            fi

            echo "Superseding #${number} (${tag}) with #${NEW_PR} (${TARGET_TAG})"
            gh pr comment "${number}" --repo "${GITHUB_REPOSITORY}" \
              --body "Superseded by ${NEW_URL}, which bumps the facet further — to \`${TARGET_TAG}\`, past this PR's \`${tag}\`. Closing this one so only one shared-skills bump is open at a time." || exit
            gh pr close "${number}" --repo "${GITHUB_REPOSITORY}" --delete-branch || exit
          done <<<"${candidates}"

      # Branch litter. A run killed between the push and `gh pr create` leaves a
      # branch with no PR, and the "adopt" path in the guard heals that only
      # while the next run still targets the same tag — once a newer tag lands,
      # nothing ever looks at the old branch again. A branch under this prefix
      # that has never had a PR holds nothing a person wrote and is reproducible
      # in full from the tag in its own name, so deleting it loses nothing. The
      # same two refusals as above apply: not a release tag, or not older than
      # what was just opened, means leave it alone.
      - name: Delete orphaned bump branches
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.ROBOT_GITHUB_TOKEN }}
          BRANCH: ${{ steps.guard.outputs.branch }}
          TARGET_TAG: ${{ steps.resolve.outputs.target_tag }}
        run: |
          # Guard the two values this step would do damage with if they were
          # empty — and unlike the supersede step above, the exposure here is
          # real rather than theoretical: an empty prefix makes the
          # `git ls-remote --heads origin "refs/heads/*"` below enumerate
          # **every branch in the repo** before the release-tag regex narrows
          # it again, and this step deletes what survives that filter.
          #
          # `-u` would not have caught today's case (both come from `env:`, so
          # they are bound even when empty); it would have caught a future
          # typo'd name, which now expands silently to empty. Same guard covers
          # both.
          if [ -z "${BRANCH_PREFIX}" ] || [ -z "${TARGET_TAG}" ]; then
            echo "::error::Refusing to run with an empty BRANCH_PREFIX or TARGET_TAG."
            exit 1
          fi

          # Same split as the tag lookup: a failed `ls-remote` is not "no
          # orphans", so it aborts rather than quietly sweeping nothing.
          refs="$(git ls-remote --heads origin "refs/heads/${BRANCH_PREFIX}*")" || exit
          heads="$(printf '%s\n' "${refs}" | awk '{ print $2 }' | sed 's#^refs/heads/##')" || exit

          for head in ${heads}; do
            [ "${head}" = "${BRANCH}" ] && continue
            tag="${head#"${BRANCH_PREFIX}"}"

            # Same strict pattern, same two exclusions, same reason — see the
            # supersede step above. A dispatched prerelease branch is never
            # swept, and that is the intended outcome rather than an oversight.
            printf '%s' "${tag}" | grep -qE '^facet-v[0-9]+\.[0-9]+\.[0-9]+$' || continue

            oldest="$(printf '%s\n%s\n' "${tag}" "${TARGET_TAG}" | sort -V | head -n 1)" || exit
            [ "${oldest}" = "${tag}" ] && [ "${tag}" != "${TARGET_TAG}" ] || continue

            # Any PR at all, in any state, means the branch is someone's record
            # of a decision — the closed-unmerged case is the declined bump the
            # guard deliberately preserves.
            #
            # **Read it, then interpret it.** Written as
            # `if [ -n "$(gh pr list …)" ]`, a `gh` failure — a rate limit, an
            # expired token, a transient API error — prints to stderr, leaves
            # `$(…)` empty, and reads as "no PR was ever opened", which is the
            # one answer that lets the delete below proceed. `-e` cannot help:
            # a substitution inside a test's condition is invisible to it
            # whatever flags are set, so this shape was equally swallowed back
            # when the block still said `set -euo pipefail`. Deleting the
            # branch behind an **open** PR closes that PR, so the failure mode
            # is someone's reviewed work disappearing because an API call
            # flaked. A lookup that did not succeed is not evidence of absence.
            #
            # Aborting rather than skipping this one candidate is deliberate,
            # and the trade is real: this is the last step, so it fails the job
            # red after the PR — the part that matters — has already been
            # opened, and it stops the loop, leaving any later orphan unswept
            # until the next bump. It is still the right default, because a
            # `gh` failure here is a token, rate-limit or network problem
            # rather than anything about this branch, so the next iteration
            # would hit it too; continuing would turn one honest red run into a
            # quiet series of skipped checks, which is the failure this whole
            # workflow exists to stop. If it ever proves noisy, skip-this-
            # candidate-and-exit-non-zero-at-the-end is the cheaper variant and
            # does not reopen the hole.
            if ! pr_number="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${head}" \
                  --state all --limit 1 --json number --jq '.[0].number // empty')"; then
              echo "::error::Could not check whether ${head} has a PR. Refusing to delete a branch on an unconfirmed lookup."
              exit 1
            fi
            [ -n "${pr_number}" ] && continue

            echo "Deleting orphaned branch ${head} (no PR ever opened for it)"
            git push origin --delete "${head}" || exit
          done

name: Linear PR event

# Forwards ready-for-review, changes-requested, and approved events to
# thoroughcare's reusable Linear move. Approved moves the ticket only.
# It does not deploy or run regressions.

on:
  pull_request:
    types: [opened, ready_for_review]
  pull_request_review:
    types: [submitted]

concurrency:
  group: linear-pr-event-${{ github.event.pull_request.number }}-${{ github.event.review.state || github.event.action }}
  cancel-in-progress: true

jobs:
  move:
    name: Move Linear ticket
    if: ${{ (github.event_name == 'pull_request' && !github.event.pull_request.draft) || github.event.review.state == 'changes_requested' || github.event.review.state == 'approved' }}
    permissions:
      contents: read
      pull-requests: read
    uses: thoroughcare/thoroughcare/.github/workflows/linear_pr_event_reusable.yml@master
    with:
      event: ${{ github.event_name == 'pull_request' && 'ready_for_review' || github.event.review.state }}
    secrets:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
